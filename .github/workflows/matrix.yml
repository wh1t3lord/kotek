name: matrix

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: matrix-nightly
  cancel-in-progress: false

jobs:
  config:
    name: ${{ matrix.name }}
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: minimal-debug, cmake: "-DCMAKE_BUILD_TYPE=Debug", cfg: Debug }
          - { name: minimal-release, cmake: "-DCMAKE_BUILD_TYPE=Release", cfg: Release }
          - { name: plugin-linkage, cmake: "-DCMAKE_BUILD_TYPE=Debug -DKOTEK_LINKAGE=PLUGIN -DKOTEK_LINKAGE_FORCE_STATIC=\"zircon.core;zircon.ecs;zircon.editor;zircon.editor.commands;zircon.editor.session;zircon.editor.ui;zircon.game;zircon.game.session;zircon.render;zircon.world\"", cfg: Debug }
          - { name: math-glm, cmake: "-DCMAKE_BUILD_TYPE=Debug -DKOTEK_MATH_LIBRARY=GLM", cfg: Debug }
          - { name: math-dxm, cmake: "-DCMAKE_BUILD_TYPE=Debug -DKOTEK_MATH_LIBRARY=DXM", cfg: Debug }
          - { name: math-own, cmake: "-DCMAKE_BUILD_TYPE=Debug -DKOTEK_MATH_LIBRARY=KOTEK_OWN", cfg: Debug }
          - { name: deps-manual, cmake: "-DCMAKE_BUILD_TYPE=Debug -DKOTEK_DEPS_FOLDER=ci-manual", cfg: Debug }

    steps:
      - uses: actions/checkout@v4

      - name: cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/installed
            vcpkg/packages
            vcpkg/buildtrees
            vcpkg/vcpkg.exe
          key: vcpkg-${{ runner.os }}-x64-windows-static-v2-${{ hashFiles('cmake/windows/vcpkg_nuget_minimal.cmake') }}
          # a key bump (dep-list change) must NOT mean a cold tree: fall back
          # to the previous generation's tree so only the changed ports
          # rebuild (see the note in build.yml)
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-static-v2-

      - name: setup msvc
        uses: ilammy/msvc-dev-cmd@v1.13.0

      # deps-manual leg (K10): manual deps mode end-to-end. Deps are
      # installed once by a vcpkg-mode warmup configure (the manual mode
      # itself never touches vcpkg), then ci-manual/deps.json overrides two
      # deps to the same prefix (exercises the wrapper's json tier) and
      # CMAKE_PREFIX_PATH covers the rest (exercises the fallback tier) —
      # the convention tier is proven by the wrapper's cmake -P fixtures
      - name: warmup deps for the manual leg
        if: matrix.name == 'deps-manual'
        run: cmake -S . -B build-warmup -DCMAKE_BUILD_TYPE=Debug

      - name: prepare the manual deps folder
        if: matrix.name == 'deps-manual'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-manual | Out-Null
          $prefix = (Resolve-Path "vcpkg/installed/x64-windows-static").Path
          @{ Tracy = $prefix; glm = $prefix } | ConvertTo-Json | Set-Content ci-manual/deps.json
          "CMAKE_PREFIX_PATH=$prefix" >> $env:GITHUB_ENV

      - name: configure
        run: cmake -S . -B build ${{ matrix.cmake }}

      # matrix.cfg drives the build: the VS generator ignores CMAKE_BUILD_TYPE
      # at build time, so --config must come from the leg (minimal-release
      # silently built Debug before this)
      - name: build
        run: cmake --build build --config ${{ matrix.cfg }} --parallel 4

      - name: upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-logs-${{ matrix.name }}
          path: build/**/*.log
          retention-days: 14
